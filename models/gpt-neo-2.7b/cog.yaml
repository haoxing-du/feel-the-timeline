image: "r8.im/haoxing-du/feel-timeline-gpt-neo-2-7b"

build:
  gpu: true
  python_version: "3.11"
  python_requirements: requirements.txt
  run:
    - >-
      python -c "from huggingface_hub import snapshot_download; snapshot_download('EleutherAI/gpt-neo-2.7B', revision='e24fa291132763e59f4a5422741b424fb5d59056', local_dir='/weights', allow_patterns=['config.json','model.safetensors','merges.txt','vocab.json','tokenizer_config.json','special_tokens_map.json'])"

run: "predict.py:Runner"
